# Base de datos PostgreSQL para desarrollo local: npm run db:up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: servicio
      POSTGRES_PASSWORD: servicio
      POSTGRES_DB: servicio_social
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
volumes:
  datos:
